<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جستجوی خدمات</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>خدمات موجود</h1>
        <a href="{{ url_for('index') }}" class="btn">بازگشت به خانه</a>
    </header>

    <main>
        <div class="services-container">
            {% for service in services %}
            <div class="service-card">
                <h3>{{ service.title }}</h3>
                <p class="category">{{ service.category }}</p>
                <p>{{ service.description }}</p>
                <div class="service-footer">
                    <span class="date">{{ service.date }}</span>
                    <a href="tel:{{ service.contact }}" class="contact-btn">تماس</a>
                </div>
            </div>
            {% else %}
            <p class="no-services">هیچ خدمتی ثبت نشده است.</p>
            {% endfor %}
        </div>
    </main>

    <footer>
        <p>تمامی حقوق محفوظ است © ۱۴۰۲</p>
    </footer>
</body>
</html>

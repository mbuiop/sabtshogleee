<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سامانه خدمات</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>سامانه ثبت و جستجوی خدمات</h1>
    </header>

    <main>
        {% if secret_message %}
        <div class="announcement">
            <span class="close-btn" onclick="this.parentElement.style.display='none'">×</span>
            <p>{{ secret_message }}</p>
        </div>
        {% endif %}

        <div class="actions">
            <a href="{{ url_for('search') }}" class="btn">مشاهده خدمات</a>
            <a href="{{ url_for('add_service') }}" class="btn">ثبت خدمت جدید</a>
            <a href="{{ url_for('profile') }}" class="btn">پروفایل</a>
        </div>
    </main>

    <footer>
        <p>تمامی حقوق محفوظ است © ۱۴۰۲</p>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>

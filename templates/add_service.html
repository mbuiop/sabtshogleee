<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت شغل جدید</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>ثبت شغل جدید</h1>
    </header>

    <main>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" class="service-form">
            <div class="form-group">
                <label for="title">عنوان شغل:</label>
                <input type="text" id="title" name="title" required>
            </div>

            <div class="form-group">
                <label for="category">دسته‌بندی:</label>
                <select id="category" name="category" required>
                    {% for category in categories %}
                    <option value="{{ category }}">{{ category }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="description">توضیحات شغل:</label>
                <textarea id="description" name="description" rows="4" required></textarea>
            </div>

            <div class="form-group">
                <label for="contact">شماره تماس:</label>
                <input type="text" id="contact" name="contact" required>
            </div>

            <button type="submit" class="submit-btn">
                <i class="fas fa-check"></i> ثبت شغل
            </button>
        </form>
    </main>

    <nav class="bottom-nav">
        <a href="{{ url_for('add_service') }}" class="nav-btn active">
            <i class="fas fa-plus-circle"></i>
            <span>ثبت شغل</span>
        </a>
        <a href="{{ url_for('search') }}" class="nav-btn">
            <i class="fas fa-briefcase"></i>
            <span>شغل‌های موجود</span>
        </a>
        <a href="{{ url_for('add_request') }}" class="nav-btn">
            <i class="fas fa-search"></i>
            <span>درخواست شغل</span>
        </a>
    </nav>
</body>
</html>
